name: Recall Admin CI

on:
  push:
    paths:
      - "recall-admin/**"
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".goreleaser.yaml"
      - ".goreleaser.simple.yaml"
      - ".github/workflows/release.yml"
      - "deploy/docker-compose.recall.yml"
      - "deploy/recall.env.example"
      - "deploy/Caddyfile.recall"
      - "deploy/backup-recall.sh"
      - ".github/workflows/recall-admin-ci.yml"
  pull_request:
    paths:
      - "recall-admin/**"
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".goreleaser.yaml"
      - ".goreleaser.simple.yaml"
      - ".github/workflows/release.yml"
      - "deploy/docker-compose.recall.yml"
      - "deploy/recall.env.example"
      - "deploy/Caddyfile.recall"
      - "deploy/backup-recall.sh"
      - ".github/workflows/recall-admin-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recall-admin
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: righttoken_recall
          POSTGRES_USER: righttoken
          POSTGRES_PASSWORD: righttoken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U righttoken -d righttoken_recall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://righttoken:righttoken@127.0.0.1:5432/righttoken_recall
      JOB_DATABASE_URL: postgresql://righttoken:righttoken@127.0.0.1:5432/righttoken_recall
      SESSION_COOKIE_SECRET: ci-session-cookie-secret-at-least-32
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      VISITOR_HASH_KEY: ci-visitor-hash-key-at-least-32
      APP_URL: http://127.0.0.1:3000
      AUTH_MODE: development
      DEPLOYMENT_ENV: local
      INTERNAL_API_SECRET_CURRENT: ci-internal-api-secret-at-least-32
      INTERNAL_API_SECRET_PREVIOUS: ""
      SEED_PRIMARY_ADMIN_EMAIL: ci-primary-admin@example.com
      RECONCILE_ENABLED: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: recall-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Unit tests
        run: npm test
      - name: Integration and contract tests
        run: npm run test:integration
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build Web
        run: npm run build
      - name: Build Worker
        run: npm run worker:build
      - name: Build visit pipeline verifier
        run: npm run visit:verify:build
      - name: Build primary-admin bootstrap
        run: npm run bootstrap:build
      - name: Build initial reconciliation command
        run: npm run initial-reconcile:build

  main-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: righttoken_contract
          POSTGRES_USER: righttoken_contract
          POSTGRES_PASSWORD: righttoken_contract_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U righttoken_contract -d righttoken_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RECALL_CONTRACT_DATABASE_URL: >-
        postgresql://righttoken_contract:righttoken_contract_password@127.0.0.1:5432/righttoken_contract?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum
      - name: Test main-site recall services
        working-directory: backend
        run: >-
          go test -tags=unit
          ./internal/server/middleware
          ./internal/handler/admin
          ./internal/handler
          ./internal/service
          ./internal/config
          -run 'TestRecall|TestMinorUnits|TestLoadReadsRecall'
          -count=1
      - name: Test migrated recall export contract
        working-directory: backend
        run: >-
          go test -tags=recallcontract ./internal/handler/admin
          -run TestRecallUserExportAgainstMigratedPostgres
          -count=1
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install main frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test main-site recall entry
        working-directory: frontend
        run: npm run test -- --run src/composables/useRecallAccess.test.ts
      - name: Validate main frontend
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm run build

  container:
    runs-on: ubuntu-latest
    needs: [quality, main-contract]
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        working-directory: recall-admin
        run: docker build -t righttoken-recall-admin:ci .
      - name: Build main-site production image
        run: docker build -t righttoken-main:ci .
      - name: Validate local Compose
        working-directory: recall-admin
        run: docker compose --env-file .env.example config --quiet
      - name: Validate production Compose
        working-directory: deploy
        run: >-
          docker compose
          --env-file .env.example
          --env-file recall.env.example
          -f docker-compose.yml
          -f docker-compose.recall.yml
          config --quiet
      - name: Validate recall Caddy configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/Caddyfile.recall:/etc/caddy/Caddyfile:ro"
          caddy:2.8
          caddy validate --config /etc/caddy/Caddyfile
