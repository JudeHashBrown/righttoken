services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: righttoken_recall
      POSTGRES_USER: righttoken
      POSTGRES_PASSWORD: righttoken
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U righttoken -d righttoken_recall"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
